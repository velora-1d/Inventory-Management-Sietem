version: '3.8'

services:
  # PHP Application Server
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: inventory_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../:/var/www
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - postgres
      - redis
    networks:
      - inventory_network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: inventory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-inventory_db}
      POSTGRES_USER: ${DB_USERNAME:-inventory_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventory_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inventory_network

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: inventory_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - inventory_network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: inventory_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - inventory_network

networks:
  inventory_network:
    driver: bridge

volumes:
  postgres_data:
